<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-label="3D archive scene placeholder">
  <defs>
    <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="linear" slope="0.05"/></feComponentTransfer></filter><radialGradient id="vig" cx="0.5" cy="0.45" r="0.75"><stop offset="0.55" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity="0.55"/></radialGradient>
    <linearGradient id="a1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0C1114"/><stop offset="1" stop-color="#080A0B"/></linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#18E6E8" stop-opacity="0.22"/><stop offset="1" stop-color="#18E6E8" stop-opacity="0"/></linearGradient>
    <linearGradient id="photo" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1C2A30"/><stop offset="1" stop-color="#0F171B"/></linearGradient>
    <radialGradient id="fglow" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#18E6E8" stop-opacity="0.35"/><stop offset="1" stop-color="#18E6E8" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#a1)"/>
  <!-- shelf silhouettes -->
  <g fill="#0B0F12">
    <rect x="0" y="180" width="240" height="620"/><rect x="960" y="180" width="240" height="620"/>
  </g>
  <g fill="#18E6E8" opacity="0.25">
    <rect x="30" y="240" width="60" height="8"/><rect x="120" y="330" width="80" height="8"/><rect x="40" y="430" width="52" height="8"/>
    <rect x="1000" y="260" width="70" height="8"/><rect x="1090" y="380" width="60" height="8"/><rect x="1010" y="480" width="80" height="8"/>
  </g>
  <!-- god rays -->
  <polygon points="540,0 660,0 860,800 380,800" fill="url(#beam)"/>
  <!-- floating photo frame -->
  <ellipse cx="600" cy="620" rx="240" ry="34" fill="url(#fglow)"/>
  <g transform="rotate(-6 600 400)">
    <rect x="450" y="260" width="300" height="280" rx="10" fill="url(#photo)" stroke="#18E6E8" stroke-opacity="0.65" stroke-width="2"/>
    <circle cx="600" cy="360" r="52" fill="#18E6E8" opacity="0.75"/>
    <path d="M540 470 L600 420 L660 470" fill="none" stroke="#18E6E8" stroke-width="3" opacity="0.6"/>
  </g>
  <!-- dust motes -->
  <g fill="#F5F7F7"><circle cx="500" cy="200" r="2" opacity="0.5"/><circle cx="700" cy="160" r="1.5" opacity="0.4"/><circle cx="640" cy="560" r="2" opacity="0.35"/><circle cx="430" cy="480" r="1.5" opacity="0.3"/></g>
  <rect width="1200" height="800" filter="url(#grain)"/>
  <rect width="1200" height="800" fill="url(#vig)"/><rect x="0.5" y="0.5" width="1199" height="799" fill="none" stroke="#FFFFFF" stroke-opacity="0.06"/>
</svg>
