<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 860" role="img" aria-label="Cinematic 3D landscape">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#03141c"/>
      <stop offset="0.55" stop-color="#07333c"/>
      <stop offset="1" stop-color="#0a4a52"/>
    </linearGradient>
    <radialGradient id="moon" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#d8fffc"/>
      <stop offset="0.55" stop-color="#7ff3f0"/>
      <stop offset="1" stop-color="#7ff3f0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3df0f1" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#3df0f1" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ridge1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d5a63"/>
      <stop offset="1" stop-color="#062a31"/>
    </linearGradient>
    <linearGradient id="ridge2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#093f47"/>
      <stop offset="1" stop-color="#041e24"/>
    </linearGradient>
    <linearGradient id="fore" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#04262c"/>
      <stop offset="1" stop-color="#010e12"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="860" fill="url(#sky)"/>

  <!-- stars -->
  <g fill="#c9fbff">
    <circle cx="120" cy="90" r="1.6" opacity="0.9"/><circle cx="310" cy="60" r="1.1" opacity="0.7"/>
    <circle cx="520" cy="110" r="1.4" opacity="0.8"/><circle cx="705" cy="50" r="1.2" opacity="0.6"/>
    <circle cx="910" cy="95" r="1.7" opacity="0.9"/><circle cx="1105" cy="70" r="1.3" opacity="0.75"/>
    <circle cx="200" cy="180" r="1" opacity="0.5"/><circle cx="830" cy="170" r="1.1" opacity="0.55"/>
    <circle cx="1010" cy="200" r="1" opacity="0.5"/><circle cx="420" cy="150" r="1" opacity="0.5"/>
  </g>

  <!-- moon with halo -->
  <circle cx="1010" cy="210" r="130" fill="url(#moon)" opacity="0.35"/>
  <circle cx="1010" cy="210" r="54" fill="#e8fffd"/>
  <circle cx="996" cy="198" r="10" fill="#c4f4f1" opacity="0.8"/>
  <circle cx="1024" cy="226" r="7" fill="#c4f4f1" opacity="0.7"/>

  <!-- far ridge -->
  <path d="M0 520 L150 430 L260 500 L390 400 L520 510 L660 420 L800 505 L940 415 L1080 500 L1280 430 L1280 860 L0 860 Z"
        fill="url(#ridge2)"/>
  <!-- near ridge -->
  <path d="M0 620 L180 520 L330 600 L470 505 L620 615 L780 525 L930 605 L1090 515 L1280 590 L1280 860 L0 860 Z"
        fill="url(#ridge1)"/>

  <!-- glowing river -->
  <path d="M540 860 Q600 700 700 660 Q800 625 860 540 L880 552 Q820 645 716 684 Q624 720 566 860 Z"
        fill="url(#glow)" opacity="0.85"/>
  <path d="M575 860 Q628 716 712 680 Q796 646 848 566" fill="none" stroke="#3df0f1"
        stroke-width="3" opacity="0.7" stroke-linecap="round"/>

  <!-- foreground silhouette -->
  <path d="M0 860 L0 730 Q120 700 240 735 Q360 770 470 740 L560 720 Q680 690 800 725 Q930 762 1050 730 Q1170 700 1280 735 L1280 860 Z"
        fill="url(#fore)"/>

  <!-- fireflies -->
  <g fill="#9ff7f5">
    <circle cx="300" cy="700" r="3" opacity="0.9"><animate attributeName="opacity" values="0.9;0.2;0.9" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="520" cy="760" r="2.5" opacity="0.8"><animate attributeName="opacity" values="0.8;0.15;0.8" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="760" cy="730" r="3" opacity="0.85"><animate attributeName="opacity" values="0.85;0.25;0.85" dur="3.5s" repeatCount="indefinite"/></circle>
    <circle cx="980" cy="770" r="2.5" opacity="0.8"><animate attributeName="opacity" values="0.8;0.2;0.8" dur="4.5s" repeatCount="indefinite"/></circle>
    <circle cx="110" cy="760" r="2.5" opacity="0.75"><animate attributeName="opacity" values="0.75;0.2;0.75" dur="3.8s" repeatCount="indefinite"/></circle>
  </g>

  <!-- subtle vignette -->
  <rect width="1280" height="860" fill="none" stroke="#01080b" stroke-width="120" opacity="0.35"/>
</svg>
