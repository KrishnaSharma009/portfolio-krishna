<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-label="Motion graphics placeholder">
  <defs>
    <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="linear" slope="0.05"/></feComponentTransfer></filter><radialGradient id="vig" cx="0.5" cy="0.45" r="0.75"><stop offset="0.55" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity="0.55"/></radialGradient>
    <linearGradient id="mg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0A0D0F"/><stop offset="1" stop-color="#080A0B"/></linearGradient>
    <linearGradient id="disc" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#63F5F3"/><stop offset="1" stop-color="#0AA6AA"/></linearGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#mg)"/>
  <g stroke="#F5F7F7" stroke-opacity="0.05">
    <path d="M0 0 V800"/><path d="M100 0 V800"/><path d="M200 0 V800"/><path d="M300 0 V800"/><path d="M400 0 V800"/><path d="M500 0 V800"/><path d="M600 0 V800"/><path d="M700 0 V800"/><path d="M800 0 V800"/><path d="M900 0 V800"/><path d="M1000 0 V800"/><path d="M1100 0 V800"/>
    <path d="M0 0 H1200"/><path d="M0 100 H1200"/><path d="M0 200 H1200"/><path d="M0 300 H1200"/><path d="M0 400 H1200"/><path d="M0 500 H1200"/><path d="M0 600 H1200"/><path d="M0 700 H1200"/>
  </g>
  <!-- motion arcs -->
  <g fill="none" stroke-linecap="round">
    <path d="M240 620 A 300 300 0 0 1 840 340" stroke="#18E6E8" stroke-width="3" stroke-dasharray="4 18" opacity="0.7"/>
    <path d="M180 660 A 380 380 0 0 1 900 300" stroke="#F5F7F7" stroke-width="2" stroke-dasharray="2 22" opacity="0.35"/>
  </g>
  <!-- big shapes -->
  <circle cx="620" cy="380" r="190" fill="url(#disc)" opacity="0.92"/>
  <circle cx="620" cy="380" r="250" fill="none" stroke="#18E6E8" stroke-width="2" opacity="0.4"/>
  <circle cx="620" cy="380" r="310" fill="none" stroke="#18E6E8" stroke-width="1.5" opacity="0.18"/>
  <polygon points="620,190 785,480 455,480" fill="#F5F7F7" opacity="0.08"/>
  <!-- speed lines + squares -->
  <g stroke="#63F5F3" stroke-width="3" opacity="0.8" stroke-linecap="round">
    <path d="M820 240 h90"/><path d="M850 280 h60"/><path d="M810 320 h100"/>
  </g>
  <g fill="#18E6E8"><rect x="330" y="180" width="18" height="18" opacity="0.85"/><rect x="850" y="520" width="26" height="26" opacity="0.6"/><rect x="380" y="560" width="14" height="14" opacity="0.5"/></g>
  <rect width="1200" height="800" filter="url(#grain)"/>
  <rect width="1200" height="800" fill="url(#vig)"/><rect x="0.5" y="0.5" width="1199" height="799" fill="none" stroke="#FFFFFF" stroke-opacity="0.06"/>
</svg>
